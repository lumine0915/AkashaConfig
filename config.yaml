# 机场订阅
proxy-providers:
  Airport1:
    url: "订阅url"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

# 节点信息
proxies:
  - {name: 直连, type: direct}

# 全局配置
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 外部控制面板。跑裸核请取消注释。
#external-controller: 0.0.0.0:9090
#secret: ""
#external-ui: ui
#external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:fakeip-filter"
    - "rule-set:private_domain"
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

# 出站策略
proxy-groups:
  - {name: 默认代理, type: select, proxies: [日本自动, 狮城自动, 美国自动, 香港自动, 日本节点, 狮城节点, 美国节点, 香港节点, 自动选择, 全部节点, 直连]}
  - {name: YouTube, type: select, proxies: [日本自动, 狮城自动, 美国自动, 香港自动, 日本节点, 狮城节点, 美国节点, 香港节点, 自动选择, 全部节点, 直连]}
  - {name: Google, type: select, proxies: [日本自动, 狮城自动, 美国自动, 香港自动, 日本节点, 狮城节点, 美国节点, 香港节点, 自动选择, 全部节点, 直连]}
  - {name: AI, type: select, proxies: [日本节点, 狮城节点, 美国节点, 日本自动, 狮城自动, 美国自动, 自动选择, 全部节点, 直连]}
  - {name: GitHub, type: select, proxies: [日本自动, 狮城自动, 美国自动, 香港自动, 日本节点, 狮城节点, 美国节点, 香港节点, 自动选择, 全部节点, 直连]}
  - {name: OneDrive, type: select, proxies: [日本自动, 狮城自动, 美国自动, 香港自动, 日本节点, 狮城节点, 美国节点, 香港节点, 自动选择, 全部节点, 直连]}
  - {name: Microsoft, type: select, proxies: [日本自动, 狮城自动, 美国自动, 香港自动, 日本节点, 狮城节点, 美国节点, 香港节点, 自动选择, 全部节点, 直连]}
  - {name: TikTok, type: select, proxies: [日本节点, 狮城节点, 美国节点, 日本自动, 狮城自动, 美国自动, 自动选择, 全部节点, 直连]}
  - {name: Telegram, type: select, proxies: [日本节点, 狮城节点, 美国节点, 香港节点, 日本自动, 狮城自动, 美国自动, 香港自动, 自动选择, 全部节点, 直连]}
  - {name: NETFLIX, type: select, proxies: [狮城节点, 日本节点, 美国节点, 香港节点, 狮城自动, 日本自动, 美国自动, 香港自动, 自动选择, 全部节点, 直连]}
  - {name: PayPal, type: select, proxies: [日本节点, 狮城节点, 美国节点, 香港节点, 日本自动, 狮城自动, 美国自动, 香港自动, 自动选择, 全部节点, 直连]}
  - {name: 漏网之鱼, type: select, proxies: [默认代理, 日本自动, 狮城自动, 美国自动, 香港自动, 日本节点, 狮城节点, 美国节点, 香港节点, 自动选择, 全部节点, 直连]}

  # 以下是地区分组。如果相应分组没有筛选到对应的国家，请根据自己节点名字调整筛选关键字。
  - {name: 香港自动, type: url-test, include-all: true, exclude-type: direct, hidden: true, tolerance: 50, interval: 300, filter: "(?i)(港|hk|hongkong|hong kong)"}
  - {name: 日本自动, type: url-test, include-all: true, exclude-type: direct, hidden: true, tolerance: 50, interval: 300, filter: "(?i)(日|jp|japan)"}
  - {name: 狮城自动, type: url-test, include-all: true, exclude-type: direct, hidden: true, tolerance: 50, interval: 300, filter: "(?i)(新|sg|singapore)"}
  - {name: 美国自动, type: url-test, include-all: true, exclude-type: direct, hidden: true, tolerance: 50, interval: 300, filter: "(?i)(美|us|unitedstates|united states)"}
  - {name: 自动选择, type: url-test, include-all: true, exclude-type: direct, hidden: true, tolerance: 50, interval: 300, filter: "^(?!.*(?:到期|剩余|重置|客户端|官网|群组|通知|流量)).*$"}
  - {name: 香港节点, type: select, include-all: true, exclude-type: direct, filter: "(?i)(港|hk|hongkong|hong kong)"}
  - {name: 日本节点, type: select, include-all: true, exclude-type: direct, filter: "(?i)(日|jp|japan)"}
  - {name: 狮城节点, type: select, include-all: true, exclude-type: direct, filter: "(?i)(新|sg|singapore)"}
  - {name: 美国节点, type: select, include-all: true, exclude-type: direct, filter: "(?i)(美|us|unitedstates|united states)"}
  - {name: 全部节点, type: select, include-all: true, exclude-type: direct, filter: "^(?!.*(?:到期|剩余|重置|客户端|官网|群组|通知|流量)).*$"}

# 规则匹配
rules:
  - RULE-SET,private_ip,直连,no-resolve
  - RULE-SET,private_domain,直连
  - RULE-SET,ai,AI
  - RULE-SET,github_domain,GitHub
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,Google
  - RULE-SET,onedrive_domain,OneDrive
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,apple_domain,直连
  - RULE-SET,tiktok_domain,TikTok
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,netflix_domain,NETFLIX
  - RULE-SET,paypal_domain,PayPal
  - RULE-SET,apple_ip,直连
  - RULE-SET,google_ip,Google
  - RULE-SET,netflix_ip,NETFLIX
  - RULE-SET,telegram_ip,Telegram
  - RULE-SET,geolocation-!cn,默认代理
  - RULE-SET,cn_domain,直连
  - RULE-SET,cn_ip,直连
  - MATCH,漏网之鱼

# 规则集
## type：可选http/file/inline  behavior：可选domain/ipcidr/classical format：可选yaml/text/mrs
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}
rule-providers:
  fakeip-filter: { <<: *domain, url: "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/fakeip-filter.mrs"}
